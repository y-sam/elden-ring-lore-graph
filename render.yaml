services:
  - type: web
    name: elden-ring-lore-graph
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: EDITORIAL_TOKEN
        generateValue: true
      - key: EDITORIAL_ENABLED
        value: "false"
      - key: ANSWER_GENERATOR
        value: deterministic
      - key: ANSWER_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: QUERY_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: FEEDBACK_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_MAX_CLIENTS
        value: "10000"
      - key: LOG_UNKNOWN_QUESTIONS
        value: "false"
      - key: MAX_REQUEST_BYTES
        value: "16384"
